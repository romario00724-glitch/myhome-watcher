name: model-test (тимчасово)

# Разова перевірка: як перекладають три варіанти моделі OpenAI і скільки токенів це коштує.
# До Telegram доступу немає, state.json не чіпає. Після перевірки файл видаляється.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare models
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import json, sys, time, concurrent.futures as cf
          sys.path.insert(0, ".")
          import watcher as w
          w.TELEGRAM_BOT_TOKEN, w.TELEGRAM_CHAT_ID = "", ""
          def blocked(*a, **k): raise SystemExit("Telegram у перевірці заборонений")
          w.tg_call = w.tg_upload = w.send_text = w.send_listing = w.save_state = blocked
          assert w.OPENAI_API_KEY, "немає ключа OpenAI"
          mask = lambda s: w.PHONE_RE.sub(lambda m: m.group(1)[:3] + "***", str(s or ""))

          label, url = w.load_searches()[0]
          params = w.search_params(url)
          items = [it for p in (1, 2, 3) for it in w.fetch_page(params, p)]
          picked = []
          for it in items:
              if len(picked) >= 20:
                  break
              w.enrich_with_details(it)
              time.sleep(0.4)
              desc, addr = w.plain_text(it.get("comment"))[:1500], w.clean(it.get("address"))
              if w.needs_translation(desc) or w.needs_translation(addr):
                  picked.append({"id": it["id"], "description": desc, "address": addr})
          print(f"оголошень для перекладу: {len(picked)}")

          CONFIGS = {
              "A_mini_yak_zaraz": {"model": "gpt-5-mini"},
              "B_mini_minimal": {"model": "gpt-5-mini", "reasoning_effort": "minimal"},
              "C_nano_minimal": {"model": "gpt-5-nano", "reasoning_effort": "minimal"},
          }
          def call(name, item):
              cfg = CONFIGS[name]
              payload = {**cfg, "response_format": {"type": "json_object"}, "max_completion_tokens": 4000,
                         "messages": [{"role": "system", "content": w.TRANSLATE_PROMPT},
                                      {"role": "user", "content": json.dumps(
                                          {"description": item["description"], "address": item["address"]},
                                          ensure_ascii=False)}]}
              t0 = time.time()
              status, body = w._post_json("https://api.openai.com/v1/chat/completions", payload,
                                          {"Authorization": f"Bearer {w.OPENAI_API_KEY}"}, timeout=120)
              sec = round(time.time() - t0, 1)
              try:
                  d = json.loads(body)
              except ValueError:
                  return {"error": f"HTTP {status}", "sec": sec}
              if status != 200:
                  return {"error": str((d.get("error") or {}).get("message"))[:200], "sec": sec}
              u = d.get("usage") or {}
              try:
                  parts = json.loads(d["choices"][0]["message"]["content"])
              except Exception:
                  parts = {"description": d["choices"][0]["message"].get("content")}
              return {"in": u.get("prompt_tokens"), "out": u.get("completion_tokens"),
                      "reasoning": (u.get("completion_tokens_details") or {}).get("reasoning_tokens"),
                      "sec": sec, "description": mask(parts.get("description")), "address": mask(parts.get("address"))}

          jobs = {}
          with cf.ThreadPoolExecutor(max_workers=6) as ex:
              for it in picked:
                  for name in CONFIGS:
                      jobs[ex.submit(call, name, it)] = (it["id"], name)
              results = {}
              for fut in cf.as_completed(jobs):
                  lid, name = jobs[fut]
                  results.setdefault(lid, {})[name] = fut.result()
          out = [{"id": it["id"], "description": mask(it["description"]), "address": it["address"],
                  "results": results.get(it["id"], {})} for it in picked]
          json.dump({"configs": CONFIGS, "items": out}, open("model_test.json", "w"), ensure_ascii=False, indent=1)
          for name in CONFIGS:
              ok = [r[name] for r in results.values() if name in r and "error" not in r[name]]
              err = [r[name]["error"] for r in results.values() if name in r and "error" in r[name]]
              if ok:
                  avg = lambda k: round(sum(x[k] or 0 for x in ok) / len(ok))
                  print(f"{name}: {len(ok)} ок, помилок {len(err)} | вхід {avg('in')} | вихід {avg('out')} (з них роздуми {avg('reasoning')}) | {avg('sec')} с")
              else:
                  print(f"{name}: усі з помилкою: {err[:2]}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: model-test
          path: model_test.json
          retention-days: 1
