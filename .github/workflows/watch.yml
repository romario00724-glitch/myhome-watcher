name: myhome-watcher

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # кожні 10 хв, але не на «круглій» хвилині — так GitHub рідше відкладає запуск
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуску

permissions:
  contents: write             # щоб зберігати state.json у репозиторій

concurrency:
  group: myhome-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check myhome.ge
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python watcher.py --once

      - name: Save state.json
        if: always()
        run: |
          [ -f state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -q -m "state: update [skip ci]"
          for i in 1 2 3; do
            git push -q && exit 0
            git pull -q --rebase -X theirs || true
            sleep 3
          done
          echo "Could not push state.json"
